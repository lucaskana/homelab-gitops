apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: node
                  path: apps/app-node
                - app: python
                  path: apps/app-python
          - list:
              elements:
                - env: hml
                  namespace: hml
                - env: prod
                  namespace: prod

  template:
    metadata:
      name: "{{.app}}-{{.env}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/lucaskana/homelab-gitops.git
        targetRevision: HEAD
        path: "{{.path}}"
        helm:
          valueFiles:
            - values.yaml
            - "values-{{.env}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true