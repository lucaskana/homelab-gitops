apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lucaskana/homelab-gitops.git
    targetRevision: HEAD
    path: network

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true