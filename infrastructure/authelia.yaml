apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.20
    
    helm:
      values: |
        # 1. Desativa completamente o bloco que está disparando a validação rígida do Schema
        configMap: {}

        persistence:
          enabled: true
          size: 2Gi

        ingress:
          enabled: true
          className: "traefik"

  destination:
    server: https://kubernetes.default.svc
    namespace: authelia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
