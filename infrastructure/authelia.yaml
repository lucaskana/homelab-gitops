apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.20
    
    helm:
      values: |
        # Configurações aceitas estritamente dentro do ConfigMap nativo
        configMap:
          theme: dark
          
          session:
            cookies:
              - domain: devtechdojo.com.br
                subdomain: auth
                default_redirection_url: https://devtechdojo.com.br
          
          access_control:
            default_policy: 'deny'
            rules:
              - domain: '*.devtechdojo.com.br'
                policy: 'two_factor'

          authentication_backend:
            password_reset:
              disable: true
            file:
              path: /config/users_database.yml

          storage:
            local:
              path: /config/db.sqlite3

          notifier:
            filesystem:
              filename: /config/notification.txt

        # Correção 1: Injeção de segredos via variáveis de ambiente no formato correto do chart
        podVariables:
          AUTHELIA_JWT_SECRET: "substitua_por_um_segredo_longo_e_aleatorio_jwt"
          AUTHELIA_SESSION_SECRET: "substitua_por_um_segredo_longo_e_aleatorio_session"

        # Correção 2: Criação de arquivos adicionais montados pelo Helm no bloco raiz correto
        files:
          users_database.yml: |
            users:
              admin:
                disabled: false
                displayname: "Administrador"
                password: "$argon2id$v=19$m=65536,t=3,p=4$bXlzYWx0c3RyaW5n$O3E0OStpMmE5cTJ1M2k0bzVpNm83dTg" # Senha: authelia
                email: admin@devtechdojo.com.br
                groups:
                  - admins

        # Configuração do armazenamento do banco de dados local
        persistence:
          enabled: true
          size: 2Gi

        # Estrutura do Ingress aceita pelo schema do Authelia
        ingress:
          enabled: true
          className: "traefik"

  destination:
    server: https://kubernetes.default.svc
    namespace: authelia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
