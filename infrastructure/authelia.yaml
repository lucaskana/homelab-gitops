apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  
  source:
    chart: authelia
    repoURL: https://charts.authelia.com    
    targetRevision: 0.11.20
    
    helm:
      values: |
        # Configurações estritamente aceitas no ConfigMap (Sem segredos/secrets)
        configMap:
          theme: dark
          
          session:
            cookies:
              - domain: devtechdojo.com.br
                subdomain: auth
                default_redirection_url: https://devtechdojo.com.br
          
          access_control:
            default_policy: 'deny'
            rules:
              - domain: '*.devtechdojo.com.br'
                policy: 'two_factor'

          authentication_backend:
            password_reset:
              disable: true
            file:
              path: /config/users_database.yml

          storage:
            local:
              path: /config/db.sqlite3

          notifier:
            filesystem:
              filename: /config/notification.txt

        # Passando os segredos via variáveis de ambiente aceitas pelo Chart do Authelia
        env:
          - name: AUTHELIA_JWT_SECRET
            value: "substitua_por_um_segredo_longo_e_aleatorio_jwt"
          - name: AUTHELIA_SESSION_SECRET
            value: "substitua_por_um_segredo_longo_e_aleatorio_session"

        # Geração do banco de dados de usuários obrigatório
        pod:
          files:
            /config/users_database.yml: |
              users:
                admin:
                  disabled: false
                  displayname: "Administrador"
                  password: "$argon2id$v=19$m=65536,t=3,p=4$bXlzYWx0c3RyaW5n$O3E0OStpMmE5cTJ1M2k0bzVpNm83dTg" # Senha: authelia
                  email: admin@devtechdojo.com.br
                  groups:
                    - admins

        # Configuração do armazenamento do banco de dados local
        persistence:
          enabled: true
          size: 2Gi

        # Estrutura do Ingress aceita pelo schema do Authelia
        ingress:
          enabled: true
          className: "traefik"

  destination:
    server: https://default.svc
    namespace: authelia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
