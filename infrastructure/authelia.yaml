apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  
  source:
    chart: authelia
    repoURL: https://authelia.com
    targetRevision: 0.11.20
    
    helm:
      values: |
        # 1. Avisa o Helm para NÃO criar o configMap interno dele
        configMap: {}

        # 2. Força o Helm a montar o SEU ConfigMap externo no local correto
        # O Chart oficial do Authelia aceita a propriedade "secret" para injetar o arquivo de configuração
        secret: authelia-custom-config

        # Mantemos os arquivos de usuários e persistência gerenciados normalmente
        files:
          users_database.yml: |
            users:
              admin:
                disabled: false
                displayname: "Administrador"
                password: "$argon2id$v=19$m=65536,t=3,p=4$bXlzYWx0c3RyaW5n$O3E0OStpMmE5cTJ1M2k0bzVpNm83dTg"
                email: admin@devtechdojo.com.br
                groups:
                  - admins

        persistence:
          enabled: true
          size: 2Gi

        ingress:
          enabled: true
          className: "traefik"

  destination:
    server: https://default.svc
    namespace: authelia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
