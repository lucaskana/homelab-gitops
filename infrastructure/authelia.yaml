apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.20
    
    helm:
      values: |
        # 1. Desativa completamente o bloco que está disparando a validação rígida do Schema
        configMap: {}

        # 2. Injeta as chaves secretas obrigatórias direto como variáveis de ambiente
        env:
          - name: AUTHELIA_JWT_SECRET
            value: "uma_string_muito_longa_e_aleatoria_para_jwt_aqui"
          - name: AUTHELIA_SESSION_SECRET
            value: "uma_string_muito_longa_e_aleatoria_para_session_aqui"
          - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
            value: "uma_string_muito_longa_e_aleatoria_para_storage_aqui"

        persistence:
          enabled: true
          size: 2Gi

        ingress:
          enabled: true
          className: "traefik"

  destination:
    server: https://kubernetes.default.svc
    namespace: authelia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
