apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # URL atualizada para o novo repositório da comunidade
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.10.1

    helm:
      values: |
        persistence:
          enabled: true
          size: 5Gi

        ingress:
          enabled: true
          ingressClassName: public
          hosts:
            - monitor-cloud.devtechdojo.com.br
          path: /
          pathType: Prefix

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
