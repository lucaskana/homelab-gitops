apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
spec:
  project: default
  
  source:
    chart: uptime-kuma
    repoURL: https://helm.irsigler.cloud    
    targetRevision: 4.2.0 
    
    helm:
      values: |
        persistence:
          enabled: true
          size: 4Gi
        
        ingress:
          enabled: true
          className: "traefik"
          hosts:
            - host: kuma.devtechdojo.com.br
              paths:
                - path: /
                  pathType: ImplementationSpecific

  destination:
    server: https://kubernetes.default.svc
    namespace: uptime-kuma

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
