apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.22
    helm:
      values: |
        configMap:
          # A URL principal fica na raiz do configMap
          #authelia_url: https://auth.devtechdojo.com.br
          session:
            cookies:
              - domain: auth.devtechdojo.com.br
          authentication_backend:
            file:
              path: /config/secrets/users_database.yml
              watch: true
          #authentication_backend:
          #  file:
          #    enabled: true
          storage:
            local:
              enabled: true
          notifier:
            filesystem:
              enabled: true
          secret:
            existingSecret: authelia-secrets # Sua secret principal de chaves/senhas
            files:
              users_database.yml:
                secretName: authelia-users # Nome da secret que criamos no Passo 1

  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
