apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.22
    helm:
      values: |
        configMap:
          session:
            cookies:
              - domain: auth.devtechdojo.com.br
          authentication_backend:
            file:
              path: /config/secrets/users_database.yml
              watch: true
          storage:
            local:
              enabled: true
          notifier:
            filesystem:
              enabled: true

        # CORREÇÃO: Fora do configMap, na raiz dos valores do Helm
        secret:
          existingSecret: authelia-secrets
          files:
            users_database.yml:
              secretName: authelia-users

  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true