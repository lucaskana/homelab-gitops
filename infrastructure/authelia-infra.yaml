apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.22
    helm:
      values: |
        configMap:
          session:
            cookies:
              - domain: auth.devtechdojo.com.br
          # HABILITAÇÃO OFICIAL DO ARQUIVO DE USUÁRIOS NO CHART:
          authentication_backend:
            ldap:
              enabled: false # Desativa explicitamente o LDAP padrão do Chart
            file:
              enabled: true  # Ativa o backend por arquivo no template do Helm
              path: /config/users_database.yml
              watch: true
          
          storage:
            local:
              enabled: true
          notifier:
            filesystem:
              enabled: true

          # DEFINIÇÃO CORRETA DE REGRAS PARA SUMIR O ERRO FATAL:
          access_control:
            default_policy: one_factor
            rules: []

        secret:
          existingSecret: authelia-secrets

        pod:
          extraVolumes:
            - name: users-database
              secret:
                secretName: authelia-users
          extraVolumeMounts:
            - name: users-database
              mountPath: /config/users_database.yml
              subPath: users_database.yml

  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true