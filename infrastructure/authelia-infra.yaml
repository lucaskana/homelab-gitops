apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.22
    helm:
      values: |
        configMap:
          address: https://devtechdojo.com.br
          session:
            cookies:
              - domain: auth.devtechdojo.com.br
          # CASAMENTO EXATO COM OS TEMPLATES DO CHART 0.11.22:
          authentication_backend:
            ldap:
              enabled: false
            file:
              enabled: true
              path: /config/users_database.yml
              watch: true
          
          storage:
            local:
              enabled: true
          notifier:
            filesystem:
              enabled: true

          # IMPORTANTE: Garante que as regras de controle de acesso existam textualmente
          access_control:
            default_policy: one_factor
            rules: []

        secret:
          existingSecret: authelia-secrets

        pod:
          extraVolumes:
            - name: users-database
              secret:
                secretName: authelia-users
          extraVolumeMounts:
            - name: users-database
              mountPath: /config/users_database.yml
              subPath: users_database.yml

  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true