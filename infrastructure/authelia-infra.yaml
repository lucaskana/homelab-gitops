apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  source:
    chart: authelia
    repoURL: https://repo.helmforge.dev
    targetRevision: 1.5.11
    helm:
      values: |
        config:
          server:
            buffers:
              read: 16384  # Aumenta de 4096 para 16KB
              write: 16384

          session:
            cookies:
              - domain: 'devtechdojo.com.br'
                authelia_url: 'https://auth.devtechdojo.com.br'

          access_control:
            default_policy: deny
            rules:
              - domain: ['trace.devtechdojo.com.br',  'code.devtechdojo.com.br']
                policy: two_factor
              - domain: ['draw.devtechdojo.com.br', 'homepage.devtechdojo.com.br' , 'devtechdojo.com.br']
                policy: one_factor

        usersDatabase:
          users:
            admin:
              disabled: false
              displayname: "Admin"
              email: "admin@example.com"
              password: "$argon2id$v=19$m=65536,t=3,p=4$c2FsdHN0cmluZw$315ffpFzRmbVV6skrhnS7EqmFsF/Iz5giq6IBJU4WyE"
              groups:
                - admins


  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true