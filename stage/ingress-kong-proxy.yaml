apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-cloudflare-ingress
  namespace: kong
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
  - host: api.devtechdojo.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-gateway-gateway-proxy # O nome do seu serviço do Kong (Data Plane)
            port:
              number: 80
