apiVersion: v1
kind: Secret
metadata:
  name: infisical-credentials
  namespace: infisical
type: Opaque
stringData:
  clientId: "7dd6f4c2-faf1-41ea-b39f-f8f4d411a911"
  clientSecret: "3dd95fe24892595d8548eb67ac3a8963fb44633c356d5c057d3ef27bcc2172c3"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-backend
spec:
  provider:
    infisical:
      hostAPI: https://infisical.devtechdojo.com.br
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            key: clientId
            namespace: infisical # 🟢 Corrigido para apontar para o namespace correto
          clientSecret:
            name: infisical-credentials
            key: clientSecret
            namespace: infisical # 🟢 Corrigido para apontar para o namespace correto
      secretsScope:
        projectSlug: "homelab-h-npj"
        environmentSlug: "staging"
        secretsPath: "/"
--- # Secrets Grafana / Pulse
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth-grafana-k8s-secret
  namespace: monitoring # 🟢 OBRIGATÓRIO: Mesmo namespace onde o seu Grafana roda
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore # 💡 Certifique-se de que o Store é do tipo Cluster (Global)
  target:
    name: oauth-grafana-k8s-secret
    creationPolicy: Owner
  data:
    - secretKey: AUTH_CLIENT_ID
      remoteRef:
        key: CLIENT_ID_GRAFANA
    - secretKey: AUTH_CLIENT_SECRET
      remoteRef:
        key: CLIENT_SECRET_GRAFANA
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-oauth-secrets
  namespace: pulse # Namespace de destino do Pulse
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: oauth-pulse-k8s-secret # Nome da secret gerada no K8s
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: CLIENT_ID_PULSE # Nome da variável correspondente dentro do Infisical
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: CLIENT_SECRET_PULSE # Nome da variável correspondente dentro do Infisical
