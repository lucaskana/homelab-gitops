apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
spec:
  project: default
  
  source:
    chart: infisical-standalone
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    targetRevision: 1.11.0
    
    helm:
      values: |
        ingress:
          enabled: true
          hostName: "infisical.devtechdojo.com.br"  # Replace with your domain
          ingressClassName: traefik

          nginx:
            enabled: false
          annotations: {}
          tls: []
          # ➜  kubectl create secret generic infisical-secrets \
          # --namespace infisical \
          # --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
          # --from-literal=ENCRYPTION_KEY="$(openssl rand -hex 16)" \
          # --from-literal=SITE_URL="http://infisical.devtechdojo.com.br"

  destination:
    server: https://kubernetes.default.svc
    namespace: infisical

  # Política de sincronização automática e criação do namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  