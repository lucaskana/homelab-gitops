apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  
  source:
    chart: grafana
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 13.2.7
    
    helm:
      values: |
        assertNoLeakedSecrets: false
        extraSecretMounts:
          - name: oauth-secrets-volume
            mountPath: /etc/secrets/oauth
            secretName: oauth-grafana-k8s-secret # Nome exato da Secret criada pelo ESO
            readOnly: true
            optional: false
        grafana.ini:
          server:
            root_url: https://monitor.devtechdojo.com.br
          # --- ADDED CODE TO DISABLE LOGIN FORM ---
          auth:
            disable_login_form: true
          auth.basic:
            enabled: false
          # ----------------------------------------
          auth.generic_oauth:
            enabled: true
            name: "OIDC"
            allow_sign_up: true
            client_id: "$__file{/etc/secrets/oauth/AUTH_CLIENT_ID}"
            client_secret: "$__file{/etc/secrets/oauth/AUTH_CLIENT_SECRET}"
            scopes: openid profile email groups
            auth_url: "https://authentik.devtechdojo.com.br/application/o/authorize/"
            token_url: "https://authentik.devtechdojo.com.br/application/o/token/"
            api_url: "https://authentik.devtechdojo.com.br/application/o/userinfo/"
            allow_assign_grafana_admin: true
            role_attribute_path: "contains(groups[*], 'grafana-admin') && 'GrafanaAdmin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'"
        ingress:
          enabled: true
          ingressClassName: traefik
          # Values can be templated
          annotations: {}
            # kubernetes.io/ingress.class: nginx
            # kubernetes.io/tls-acme: "true"
          labels: {}
          path: /
          pathType: Prefix

          hosts:
            - monitor.devtechdojo.com.br
          ## Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
          extraPaths: []
          # - path: /*
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: ssl-redirect
          #       port:
          #         name: use-annotation


          tls: []
          #  - secretName: chart-example-tls
          #    hosts:
          #      - chart-example.local

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Política de sincronização automática e criação do namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  