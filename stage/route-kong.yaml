apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-test
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
      - name: httpbin
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-service
  namespace: kong
spec:
  selector:
    app: httpbin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: httpbin-ingress
  namespace: kong
  annotations:
    # Garante que este Ingress seja gerenciado pelo controlador do Kong
    kubernetes.io/ingress.class: kong 
    konghq.com/strip-path: "true" # Altere para "false" se precisar manter o caminho completo
spec:
  ingressClassName: kong  # 👈 ADICIONE ESTA LINHA AQUI
  rules:
  - http:
      paths:
      # - path: /teste
      - path: /
        pathType: Prefix
        backend:
          service:
            name: httpbin-service # Tem que ser o nome exato do seu Service
            port:
              number: 80

