apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia-http
  namespace: authelia # Altere para o namespace onde o Authelia está instalado
spec:
  entryPoints:
    - websecure # Ouve na porta HTTPS (443) do Traefik
  routes:
    - match: Host(`auth.devtechdojo.com.br`) # O subdomínio que você quer usar para o Authelia
      kind: Rule
      services:
        - name: authelia # Nome exato do serviço do Authelia no Kubernetes
          port: 80 # Porta padrão do serviço do Authelia
